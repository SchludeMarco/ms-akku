      if (spans[1]) spans[1].className = 'font-label-sm text-label-sm text-on-surface-variant';
    });
    button.className = 'min-h-[56px] px-2 rounded-xl bg-primary-container text-on-primary-fixed border border-primary font-semibold shadow-md flex flex-col items-center justify-center gap-0.5 text-center transition-all';
    const spans = button.querySelectorAll('span');
    if (spans[0]) spans[0].className = 'font-label-md text-label-md text-on-primary-fixed font-bold';
    if (spans[1]) spans[1].className = 'font-label-sm text-label-sm text-on-primary-fixed/80';
  }

  function toggleChip(button) {
    const isSelected = button.classList.contains('bg-primary-container');
    if (isSelected) {
      button.className = 'min-h-[46px] px-3.5 py-1.5 rounded-full bg-surface-container-low border border-outline-variant/40 text-on-surface hover:bg-surface-container transition-all flex items-center gap-1.5 font-label-md text-label-md';
      const icon = button.querySelector('.material-symbols-outlined');
      if (icon) icon.remove();
    } else {
      button.className = 'min-h-[46px] px-3.5 py-1.5 rounded-full bg-primary-container text-on-primary-fixed border border-primary/50 shadow-sm flex items-center gap-1.5 font-label-md text-label-md font-medium';
      const span = document.createElement('span');
      span.className = 'material-symbols-outlined text-[18px]';
      span.innerText = 'check';
      button.prepend(span);
    }
  }

  function selectTime(button) {
    const parent = button.parentElement;
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.className = 'min-h-[46px] px-3 rounded-lg bg-surface-container-low border border-outline-variant/40 text-on-surface hover:bg-surface-container transition-all flex items-center justify-center gap-1.5 font-label-md text-label-md';
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon) icon.remove();
    });
    button.className = 'min-h-[46px] px-3 rounded-lg bg-primary-container text-on-primary-fixed border border-primary/50 shadow-sm flex items-center justify-center gap-1.5 font-label-md text-label-md font-medium';
    const span = document.createElement('span');
    span.className = 'material-symbols-outlined text-[18px]';
    span.innerText = 'check';
    button.prepend(span);
  }

  function togglePrimary(button) {
    button.classList.add('bg-surface-container-high');
    setTimeout(() => {
      button.classList.remove('bg-surface-container-high');
    }, 200);
  }

  function handleSave() {
    if (window.history && window.history.length > 1) {
      history.back();
    }
  }
</script></main></body></html>
