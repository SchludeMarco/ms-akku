<script>
  // Symptom selection toggling
  document.querySelectorAll('.symptom-card').forEach(card => {
    card.addEventListener('click', () => {
      const isSelected = card.getAttribute('data-selected') === 'true';
      const checkIcon = card.querySelector('.check-icon');
      const iconBox = card.querySelector('div:first-child > div');
      const textLabel = card.querySelector('div:first-child > span');

      if (isSelected) {
        card.setAttribute('data-selected', 'false');
        card.setAttribute('aria-checked', 'false');
        card.classList.remove('bg-surface-container', 'text-primary');
        card.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
        
        iconBox.classList.remove('bg-surface-container-lowest', 'text-primary');
        iconBox.classList.add('bg-surface-container-low', 'text-on-surface-variant');

        textLabel.classList.remove('font-semibold');
        textLabel.classList.add('font-medium');

        checkIcon.classList.remove('bg-primary', 'text-on-primary');
        checkIcon.classList.add('bg-surface-container-high', 'text-transparent');
      } else {
        card.setAttribute('data-selected', 'true');
        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
        card.classList.add('bg-surface-container', 'text-primary');

        iconBox.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        iconBox.classList.add('bg-surface-container-lowest', 'text-primary');

        textLabel.classList.remove('font-medium');
        textLabel.classList.add('font-semibold');

        checkIcon.classList.remove('bg-surface-container-high', 'text-transparent');
        checkIcon.classList.add('bg-primary', 'text-on-primary');
      }
    });
  });

  function toggleCustomInput() {
    const box = document.getElementById('custom-input-box');
    const input = document.getElementById('custom-input-field');
    if (box.classList.contains('hidden')) {
      box.classList.remove('hidden');
      box.classList.add('flex');
      input.focus();
    } else {
      box.classList.add('hidden');
      box.classList.remove('flex');
    }
  }

  function saveCustomSymptom() {
    const input = document.getElementById('custom-input-field');
    const name = input.value.trim();
    if (!name) return;

    const grid = document.getElementById('symptom-grid');
    const newBtn = document.createElement('button');
    newBtn.type = 'button';
    newBtn.setAttribute('role', 'checkbox');
    newBtn.setAttribute('aria-checked', 'true');
    newBtn.setAttribute('data-selected', 'true');
    newBtn.className = 'symptom-card min-h-[64px] flex items-center justify-between p-3.5 rounded-xl bg-surface-container text-primary shadow-sm text-left transition-all active:scale-[0.98]';

    newBtn.innerHTML = `
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-lg bg-surface-container-lowest flex items-center justify-center shrink-0 text-primary">
          <span class="material-symbols-outlined text-[20px]">edit_note</span>
        </div>
        <span class="font-label-lg text-label-lg text-on-surface font-semibold truncate">${name}</span>
      </div>
      <div class="check-icon w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-[16px]">check</span>
      </div>
    `;

    // Add interactivity to new card
    newBtn.addEventListener('click', () => {
      const isSelected = newBtn.getAttribute('data-selected') === 'true';
      const checkIcon = newBtn.querySelector('.check-icon');
      const iconBox = newBtn.querySelector('div:first-child > div');
      const textLabel = newBtn.querySelector('div:first-child > span');

      if (isSelected) {
        newBtn.setAttribute('data-selected', 'false');
        newBtn.setAttribute('aria-checked', 'false');
        newBtn.classList.remove('bg-surface-container', 'text-primary');
        newBtn.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
        iconBox.classList.remove('bg-surface-container-lowest', 'text-primary');
        iconBox.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        textLabel.classList.remove('font-semibold');
        textLabel.classList.add('font-medium');
        checkIcon.classList.remove('bg-primary', 'text-on-primary');
        checkIcon.classList.add('bg-surface-container-high', 'text-transparent');
      } else {
        newBtn.setAttribute('data-selected', 'true');
        newBtn.setAttribute('aria-checked', 'true');
        newBtn.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
        newBtn.classList.add('bg-surface-container', 'text-primary');
        iconBox.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        iconBox.classList.add('bg-surface-container-lowest', 'text-primary');
        textLabel.classList.remove('font-medium');
        textLabel.classList.add('font-semibold');
        checkIcon.classList.remove('bg-surface-container-high', 'text-transparent');
        checkIcon.classList.add('bg-primary', 'text-on-primary');
      }
    });

    grid.appendChild(newBtn);
    input.value = '';
    toggleCustomInput();
  }
