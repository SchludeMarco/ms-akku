<script>
  function toggleAccordion(id) {
    const el = document.getElementById(id);
    if (el) {
      el.classList.toggle('hidden');
    }
  }

  function selectPill(button, group) {
    const parent = button.parentElement;
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.className = 'min-h-[56px] px-space-xs rounded-xl bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-all flex flex-col items-center justify-center gap-0.5 text-center shadow-sm';
      const labelDesc = btn.querySelectorAll('span')[1];
      if (labelDesc) labelDesc.className = 'font-label-sm text-label-sm text-on-surface-variant';
    });
    button.className = 'min-h-[56px] px-space-xs rounded-xl bg-primary text-on-primary shadow-md flex flex-col items-center justify-center gap-0.5 text-center transition-all';
    const activeDesc = button.querySelectorAll('span')[1];
    if (activeDesc) activeDesc.className = 'font-label-sm text-label-sm text-primary-fixed';
  }

  function toggleChip(button) {
    const isSelected = button.classList.contains('bg-primary-fixed-dim');
    if (isSelected) {
      button.className = 'min-h-[48px] px-space-md py-space-xs rounded-full bg-surface-container-lowest text-on-surface shadow-sm hover:bg-surface-container transition-all flex items-center gap-1.5 font-label-md text-label-md';
      const icon = button.querySelector('.material-symbols-outlined');
      if (icon) icon.remove();
    } else {
      button.className = 'min-h-[48px] px-space-md py-space-xs rounded-full bg-primary-fixed-dim text-on-primary-fixed shadow-sm flex items-center gap-1.5 font-label-md text-label-md';
      const span = document.createElement('span');
      span.className = 'material-symbols-outlined text-[18px]';
      span.innerText = 'check';
      button.prepend(span);
    }
  }

  function selectTime(button) {
    const parent = button.parentElement;
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.className = 'min-h-[48px] px-space-sm rounded-lg bg-surface-container-lowest text-on-surface shadow-sm hover:bg-surface-container transition-all flex items-center justify-center gap-1.5 font-label-md text-label-md';
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon) icon.remove();
    });
    button.className = 'min-h-[48px] px-space-sm rounded-lg bg-primary-container text-on-primary shadow-sm flex items-center justify-center gap-1.5 font-label-md text-label-md';
    const span = document.createElement('span');
    span.className = 'material-symbols-outlined text-[18px]';
    span.innerText = 'check';
    button.prepend(span);
  }

  function togglePrimary(button) {
    button.classList.add('bg-surface-container');
    setTimeout(() => {
      button.classList.remove('bg-surface-container');
    }, 200);
  }

  function handleSave() {
    // Gentle return feedback
    if (window.history && window.history.length > 1) {
      history.back();
